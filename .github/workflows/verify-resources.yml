name: Verify resource links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh public link-health ledger
        run: node scripts/verify-links.mjs
      - name: Commit changed results
        run: |
          if git diff --quiet -- data/health.json; then
            echo "No health changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health.json
          git commit -m "chore: refresh resource link health"
          git push
